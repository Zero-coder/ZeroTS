[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerots"
version = "0.1.0"
description = "Zero-shot time-series forecasting with image-reconstruction style adaptation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
hf = ["transformers>=4.40"]
data = ["pandas>=2.0", "scikit-learn>=1.3"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zerots*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
